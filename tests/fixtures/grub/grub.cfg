set default="0"

menuentry 'Felunyx OS' --class felunyx $menuentry_id_option 'gnulinux-simple-ROOTUUID' {
    linux /boot/vmlinuz-linux-zen root=UUID=ROOTUUID rw
    initrd /boot/initramfs-linux-zen.img
}

submenu 'Advanced options for Felunyx OS' $menuentry_id_option 'gnulinux-advanced-ROOTUUID' {
    menuentry 'Felunyx OS, with Linux Zen' --class felunyx $menuentry_id_option 'gnulinux-linux-zen-advanced-ROOTUUID' {
        linux /boot/vmlinuz-linux-zen root=UUID=ROOTUUID rw
        initrd /boot/initramfs-linux-zen.img
    }
    menuentry 'Felunyx OS, with Linux LTS' --class felunyx $menuentry_id_option 'gnulinux-linux-lts-advanced-ROOTUUID' {
        linux /boot/vmlinuz-linux-lts root=UUID=ROOTUUID rw
        initrd /boot/initramfs-linux-lts.img
    }
}
