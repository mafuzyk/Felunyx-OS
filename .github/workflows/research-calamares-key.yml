name: Research Calamares signing key

on:
  pull_request:
    paths:
      - .github/workflows/research-calamares-key.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve identity certificate and technical update
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            'https://calamares.io/pk-7FEA3DA6169C77D6.txt' \
            --output calamares-identity-certificate.asc
          curl --fail --location --silent --show-error \
            'https://keys.openpgp.org/vks/v1/by-fingerprint/6D98B995A1CA6CE4BB906518C7AA337DFA13881E' \
            --output calamares-technical-update.asc
          sha256sum calamares-identity-certificate.asc calamares-technical-update.asc
      - name: Merge and inspect exact OpenPGP identities
        run: |
          set -Eeuo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import-options import-minimal --import calamares-identity-certificate.asc
          gpg --batch --import-options import-minimal --import calamares-technical-update.asc
          gpg --batch --with-colons --with-subkey-fingerprint --list-keys \
            | awk -F: '$1=="pub" || $1=="sub" || $1=="fpr" || $1=="uid" { print }' \
            | tee calamares-release-key-identities.txt
          grep -F '00ACD15E25A79FEE028B0EE57FEA3DA6169C77D6' calamares-release-key-identities.txt
          grep -F '6D98B995A1CA6CE4BB906518C7AA337DFA13881E' calamares-release-key-identities.txt
          gpg --batch --armor --export 00ACD15E25A79FEE028B0EE57FEA3DA6169C77D6 \
            > calamares-release-key-merged.asc
          sha256sum calamares-release-key-merged.asc
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calamares-signing-key-research
          path: |
            calamares-identity-certificate.asc
            calamares-technical-update.asc
            calamares-release-key-merged.asc
            calamares-release-key-identities.txt
          if-no-files-found: warn
          retention-days: 7
