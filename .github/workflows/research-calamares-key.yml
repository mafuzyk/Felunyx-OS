name: Research Calamares signing key

on:
  pull_request:
    paths:
      - .github/workflows/research-calamares-key.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Discover exact Calamares 3.3.14 release assets
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            'https://api.github.com/repos/calamares/calamares/releases/tags/v3.3.14' \
            --output calamares-3.3.14-release.json
          jq -r '.assets[] | [.name, .browser_download_url] | @tsv' \
            calamares-3.3.14-release.json \
            | tee calamares-3.3.14-assets.txt

      - name: Retrieve signer certificates and release artifacts
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            'https://calamares.io/pk-7FEA3DA6169C77D6.txt' \
            --output calamares-identity-certificate.asc
          curl --fail --location --silent --show-error \
            'https://keys.openpgp.org/vks/v1/by-fingerprint/6D98B995A1CA6CE4BB906518C7AA337DFA13881E' \
            --output calamares-technical-update.asc
          tar_url=$(jq -r '.assets[] | select(.name == "calamares-3.3.14.tar.gz") | .browser_download_url' \
            calamares-3.3.14-release.json)
          signature_url=$(jq -r '.assets[] | select(.name | test("^calamares-3\\.3\\.14\\.tar\\.gz\\.(sig|asc)$")) | .browser_download_url' \
            calamares-3.3.14-release.json)
          [[ -n $tar_url ]] || { echo 'release tarball asset not found' >&2; exit 1; }
          [[ -n $signature_url ]] || { echo 'release signature asset not found' >&2; exit 1; }
          printf 'tarball_url=%s\nsignature_url=%s\n' "$tar_url" "$signature_url" \
            | tee calamares-3.3.14-selected-assets.txt
          curl --fail --location --silent --show-error \
            "$tar_url" --output calamares-3.3.14.tar.gz
          curl --fail --location --silent --show-error \
            "$signature_url" --output calamares-3.3.14.tar.gz.signature
          printf '%s  %s\n' \
            '5547f80db067dea923ae693ba6bb88eb2b2eeac1da3ebec42fce453e31c290c0' \
            'calamares-3.3.14.tar.gz' | sha256sum --check --strict
          sha256sum \
            calamares-identity-certificate.asc \
            calamares-technical-update.asc \
            calamares-3.3.14.tar.gz.signature

      - name: Merge and inspect exact OpenPGP identities
        run: |
          set -Eeuo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import-options import-minimal --import calamares-identity-certificate.asc
          gpg --batch --import-options import-minimal --import calamares-technical-update.asc
          gpg --batch --with-colons --with-subkey-fingerprint --list-keys \
            | awk -F: '$1=="pub" || $1=="sub" || $1=="fpr" || $1=="uid" { print }' \
            | tee calamares-release-key-identities.txt
          grep -F '00ACD15E25A79FEE028B0EE57FEA3DA6169C77D6' calamares-release-key-identities.txt
          grep -F '6D98B995A1CA6CE4BB906518C7AA337DFA13881E' calamares-release-key-identities.txt
          gpg --batch --armor --export 00ACD15E25A79FEE028B0EE57FEA3DA6169C77D6 \
            > calamares-release-key-merged.asc
          sha256sum calamares-release-key-merged.asc

      - name: Verify the exact Calamares 3.3.14 release signature
        run: |
          set -Eeuo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          set +e
          gpg --batch --status-fd 1 \
            --verify calamares-3.3.14.tar.gz.signature calamares-3.3.14.tar.gz \
            > calamares-release-signature-status.txt \
            2> calamares-release-signature-stderr.txt
          verify_status=$?
          set -e
          printf 'gpg_verify_exit=%s\n' "$verify_status" | tee calamares-release-signature-result.txt
          cat calamares-release-signature-status.txt
          cat calamares-release-signature-stderr.txt
          grep -F '[GNUPG:] VALIDSIG 6D98B995A1CA6CE4BB906518C7AA337DFA13881E' \
            calamares-release-signature-status.txt
          exit "$verify_status"

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calamares-signing-key-research
          path: |
            calamares-3.3.14-release.json
            calamares-3.3.14-assets.txt
            calamares-3.3.14-selected-assets.txt
            calamares-identity-certificate.asc
            calamares-technical-update.asc
            calamares-release-key-merged.asc
            calamares-release-key-identities.txt
            calamares-3.3.14.tar.gz.signature
            calamares-release-signature-status.txt
            calamares-release-signature-stderr.txt
            calamares-release-signature-result.txt
          if-no-files-found: warn
          retention-days: 7
