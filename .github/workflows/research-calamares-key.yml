name: Research Calamares signing key

on:
  push:
    branches: [ research/calamares-signing-key ]
    paths:
      - .github/workflows/research-calamares-key.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve certificate by signing-subkey fingerprint
        run: |
          set -Eeuo pipefail
          url='https://keys.openpgp.org/vks/v1/by-fingerprint/6D98B995A1CA6CE4BB906518C7AA337DFA13881E'
          curl --fail --location --silent --show-error "$url" --output calamares-release-key.asc
          sha256sum calamares-release-key.asc
      - name: Inspect exact OpenPGP identities
        run: |
          set -Eeuo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import-options import-minimal --import calamares-release-key.asc
          gpg --batch --with-colons --with-subkey-fingerprint --list-keys \
            | awk -F: '$1=="pub" || $1=="sub" || $1=="fpr" || $1=="uid" { print }' \
            | tee calamares-release-key-identities.txt
          grep -F '6D98B995A1CA6CE4BB906518C7AA337DFA13881E' calamares-release-key-identities.txt
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calamares-signing-key-research
          path: |
            calamares-release-key.asc
            calamares-release-key-identities.txt
          if-no-files-found: error
          retention-days: 7
