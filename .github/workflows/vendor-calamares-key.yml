name: Vendor Calamares release certificate

on:
  push:
    branches: [ research/calamares-signing-key ]
    paths:
      - .github/workflows/vendor-calamares-key.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Phase 2 implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/phase-2-implementation
          fetch-depth: 1
      - name: Reconstruct and verify the exact public certificate
        run: |
          set -Eeuo pipefail
          identity_url='https://calamares.io/pk-7FEA3DA6169C77D6.txt'
          identity_sha256='46ed1304bf8db472de244a2647a3e04383753d5a3ccf55ce75660f7df0aee0b3'
          update_url='https://keys.openpgp.org/vks/v1/by-fingerprint/6D98B995A1CA6CE4BB906518C7AA337DFA13881E'
          update_sha256='86a20967e356756e7f19bdd24ef5d3b01a17e12c32d58400f9329ce004bc3cdf'
          merged_sha256='b3e5851676c35bc5506433ea77792e87594180581a420be9bdbc8d3f501c3789'
          primary_fingerprint='00ACD15E25A79FEE028B0EE57FEA3DA6169C77D6'
          signing_subkey_fingerprint='6D98B995A1CA6CE4BB906518C7AA337DFA13881E'

          curl --fail --location --silent --show-error "$identity_url" --output identity.asc
          curl --fail --location --silent --show-error "$update_url" --output update.asc
          printf '%s  %s\n' "$identity_sha256" identity.asc | sha256sum --check --strict
          printf '%s  %s\n' "$update_sha256" update.asc | sha256sum --check --strict

          export GNUPGHOME="$RUNNER_TEMP/calamares-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import-options import-minimal --import identity.asc
          gpg --batch --import-options import-minimal --import update.asc
          mapfile -t fingerprints < <(gpg --batch --with-colons --with-subkey-fingerprint --list-keys "$primary_fingerprint" | awk -F: '$1=="fpr" {print $10}')
          printf '%s\n' "${fingerprints[@]}" | grep -Fxq "$primary_fingerprint"
          printf '%s\n' "${fingerprints[@]}" | grep -Fxq "$signing_subkey_fingerprint"

          install -d keys/calamares
          gpg --batch --armor --export "$primary_fingerprint" > keys/calamares/3.3.14-release-key.asc
          printf '%s  %s\n' "$merged_sha256" keys/calamares/3.3.14-release-key.asc | sha256sum --check --strict
      - name: Commit the verified public certificate
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keys/calamares/3.3.14-release-key.asc
          git diff --cached --quiet && exit 0
          git commit -m 'build: vendor Calamares release certificate'
          git push origin HEAD:agent/phase-2-implementation
