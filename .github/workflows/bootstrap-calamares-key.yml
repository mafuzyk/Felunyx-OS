name: Bootstrap verified Calamares release key

on:
  push:
    branches:
      - agent/phase-2-implementation
    paths:
      - .github/workflows/bootstrap-calamares-key.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/phase-2-implementation
          fetch-depth: 0

      - name: Fetch and verify public release key
        shell: bash
        run: |
          set -Eeuo pipefail
          fingerprint=6D98B995A1CA6CE4BB906518C7AA337DFA13881E
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 0700 "$GNUPGHOME"
          curl --fail --location --silent --show-error \
            https://github.com/adriaandegroot.gpg \
            --output /tmp/adriaandegroot.gpg
          gpg --batch --import-options import-minimal --import /tmp/adriaandegroot.gpg
          actual=$(gpg --batch --with-colons --fingerprint "$fingerprint" | awk -F: '$1=="fpr" {print $10; exit}')
          uid_count=$(gpg --batch --with-colons --list-keys "$fingerprint" | awk -F: '$1=="uid" {count++} END {print count+0}')
          test "$actual" = "$fingerprint"
          test "$uid_count" -gt 0
          curl --fail --location --silent --show-error \
            https://github.com/calamares/calamares/releases/download/v3.3.14/calamares-3.3.14.tar.gz \
            --output /tmp/calamares-3.3.14.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/calamares/calamares/releases/download/v3.3.14/calamares-3.3.14.tar.gz.sig \
            --output /tmp/calamares-3.3.14.tar.gz.sig
          echo '5547f80db067dea923ae693ba6bb88eb2b2eeac1da3ebec42fce453e31c290c0  /tmp/calamares-3.3.14.tar.gz' | sha256sum --check --strict
          gpg --batch --status-fd=1 --verify /tmp/calamares-3.3.14.tar.gz.sig /tmp/calamares-3.3.14.tar.gz | tee /tmp/verify.status
          grep -F "[GNUPG:] VALIDSIG $fingerprint " /tmp/verify.status
          mkdir -p packages/calamares/keys
          gpg --batch --armor --export "$fingerprint" > packages/calamares/keys/calamares-release-3.3.14.asc
          test -s packages/calamares/keys/calamares-release-3.3.14.asc
          sha256sum packages/calamares/keys/calamares-release-3.3.14.asc > packages/calamares/keys/SHA256SUMS
          rm .github/workflows/bootstrap-calamares-key.yml

      - name: Commit verified public key
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Felunyx Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/calamares/keys .github/workflows/bootstrap-calamares-key.yml
          git diff --cached --check
          git commit -m 'build: vendor verified Calamares public release key'
          git push origin HEAD:agent/phase-2-implementation
