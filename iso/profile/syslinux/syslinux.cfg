UI menu.c32
PROMPT 0
MENU TITLE Felunyx OS Phase 2
TIMEOUT 100
DEFAULT felunyx-zen

LABEL felunyx-zen
  MENU LABEL Felunyx OS - Linux Zen
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
  INITRD /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 felunyx.phase=2 felunyx.kernel=zen

LABEL felunyx-lts
  MENU LABEL Felunyx OS - Linux LTS fallback
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
  INITRD /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 felunyx.phase=2 felunyx.kernel=lts
